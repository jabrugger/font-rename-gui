[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "font-rename-gui"
version = "0.2.0"
description = "Windows desktop interface for the independent font-rename-fm CLI."
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "jabrugger"}]
dependencies = [
  "PySide6>=6.10,<7",
  "font-rename-fm @ git+https://github.com/jabrugger/font-rename-fm.git@v0.3.1"
]

[project.optional-dependencies]
build = ["pyinstaller>=6.20,<7"]

[project.gui-scripts]
font-rename-gui = "font_rename_gui.app:main"

[project.urls]
Repository = "https://github.com/jabrugger/font-rename-gui"
Engine = "https://github.com/jabrugger/font-rename-fm"

[tool.setuptools.packages.find]
include = ["font_rename_gui*"]
