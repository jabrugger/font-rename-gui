name: Windows GUI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e ".[build]"
      - run: python -m unittest discover -v
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python tools/build_windows.py
      - run: python tools/smoke_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: FontRenameNeoGUI-windows-x64
          path: dist/FontRenameNeoGUI-*-windows-x64.zip
